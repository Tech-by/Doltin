<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quest Board — Tasks & Rewards</title>

  <!-- HilltopAds verification -->
  <meta name="9de5e6800eea3075d0bc10a2bf60693e44c97059"
        content="9de5e6800eea3075d0bc10a2bf60693e44c97059">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080a0f;
      --panel: #10131a;
      --panel2: #151922;
      --border: rgba(255,255,255,.08);
      --text: #f4f6fb;
      --muted: #9ba3b4;
      --accent: #8b7cff;
      --accent2: #6d5dfc;
      --good: #48d597;
      --warn: #f0bd54;
      --bad: #ff6b6b;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    body.teal {
      --accent: #18c7b2;
      --accent2: #0da594;
    }

    body.plum {
      --accent: #c66cff;
      --accent2: #9c45d5;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top right,
          rgba(139,124,255,.10),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 18px;
      border-right: 1px solid var(--border);
      background: rgba(10,12,17,.92);
      backdrop-filter: blur(18px);
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 28px;
    }

    .brand span {
      color: var(--accent);
    }

    .profile {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .points {
      font-size: 29px;
      font-weight: 800;
    }

    .points-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .level {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .progress {
      margin-top: 8px;
      height: 7px;
      background: rgba(255,255,255,.07);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: inherit;
      transition: width .3s ease;
    }

    .side-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      padding: 10px;
      background: rgba(255,255,255,.03);
      border-radius: 11px;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
    }

    nav {
      display: grid;
      gap: 6px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 12px;
      border-radius: 11px;
      transition: .2s;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255,255,255,.06);
      color: var(--text);
    }

    .nav-btn.active {
      box-shadow: inset 3px 0 var(--accent);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      letter-spacing: -.04em;
    }

    .topbar p {
      color: var(--muted);
      margin: 7px 0 0;
    }

    .reset-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 13px;
    }

    .reset-btn:hover {
      color: var(--text);
      border-color: rgba(255,255,255,.18);
    }

    /* =========================
       QUEST CARDS
    ========================= */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-title {
      margin: 26px 0 14px;
      font-size: 20px;
    }

    .quests {
      display: grid;
      gap: 13px;
    }

    .quest {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform .2s, border-color .2s;
    }

    .quest:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.13);
    }

    .quest.done {
      opacity: .58;
    }

    .quest-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .quest h3 {
      margin: 0;
      font-size: 17px;
    }

    .quest p {
      color: var(--muted);
      line-height: 1.55;
      margin: 7px 0 0;
      font-size: 14px;
    }

    .reward-points {
      white-space: nowrap;
      color: var(--accent);
      font-weight: 800;
    }

    .controls {
      margin-top: 16px;
    }

    .ctl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 9px 13px;
      border-radius: 10px;
      transition: .2s;
    }

    .btn:hover:not(:disabled) {
      border-color: rgba(255,255,255,.18);
      transform: translateY(-1px);
    }

    .btn.solid {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .4;
    }

    .input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--text);
      border-radius: 10px;
      padding: 11px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .input:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    .msg {
      margin-top: 9px;
      font-size: 12px;
    }

    .note {
      color: var(--muted);
    }

    .good {
      color: var(--good);
    }

    .warn {
      color: var(--warn);
    }

    .bad {
      color: var(--bad);
    }

    /* =========================
       REWARDS
    ========================= */

    .rewards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .reward {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 19px;
    }

    .reward-icon {
      font-size: 27px;
    }

    .reward h3 {
      margin: 12px 0 5px;
    }

    .reward p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
      min-height: 42px;
    }

    .reward-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      gap: 10px;
    }

    .cost {
      color: var(--accent);
      font-weight: 800;
    }

    /* =========================
       HISTORY
    ========================= */

    .history {
      display: grid;
      gap: 8px;
    }

    .history-item {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 13px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .history-item small {
      color: var(--muted);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: #181b23;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      transition: .25s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       BREAK TIMER
    ========================= */

    .break {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 14px 17px;
      border-radius: 15px;
      background: var(--panel2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: none;
      z-index: 90;
    }

    .break.show {
      display: block;
    }

    .break strong {
      color: var(--accent);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      nav {
        grid-template-columns: repeat(3, 1fr);
      }

      .nav-btn {
        text-align: center;
      }

      main {
        padding: 20px 15px 50px;
      }

      .rewards {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }
    }

    @media (max-width: 480px) {

      .topbar {
        flex-direction: column;
      }

      .quest-top {
        flex-direction: column;
        gap: 7px;
      }

      .reward-bottom {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">
      Quest<span>Board</span>
    </div>

    <div class="profile">

      <div class="points" id="points">

      </div>

<div

  ☕ Break:

  <strong id="breakTime">

</div>


<script>

  /* =====================================================
     STORAGE
  ===================================================== */

  const SAVE_KEY = "questboard.v1";

  const LEVEL_STEP = 100;


  /* =====================================================
     QUESTS
  ===================================================== */

  const QUESTS = [

    {
      id: "sprint",
      title: "Deep focus sprint",
      desc: "Stay on this tab for 60 seconds.",
      points: 20,
      kind: "timer",
      seconds: 60
    },

    {
      id: "reflect",
      title: "Read & reflect",
      desc: "Read for 90 seconds, then write one sentence.",
      points: 30,
      kind: "timer",
      seconds: 90,
      needNote: true,
      noteMin: 15
    },

    {
      id: "plan",
      title: "Plan the day",
      desc: "List your top three priorities for today.",
      points: 25,
      kind: "write",
      noteMin: 20
    },

    {
      id: "math",
      title: "Mental math",
      desc: "No calculator: what is 17 × 6?",
      points: 10,
      kind: "answer",
      answer: "102"
    },

    {
      id: "geo",
      title: "Knowledge check",
      desc: "Which city is the capital of Japan?",
      points: 15,
      kind: "answer",
      answer: "tokyo"
    },

    {
      id: "visit-a",
      title: "Visit Asnek",
      desc: "Open asnek.netlify.app and stay there for 10 seconds before returning.",
      points: 5,
      kind: "external",
      url: "https://asnek.netlify.app",
      seconds: 10
    },

    {
      id: "visit-b",
      title: "Visit Nexla",
      desc: "Open nexla.netlify.app and stay there for 10 seconds before returning.",
      points: 5,
      kind: "external",
      url: "https://nexla.netlify.app",
      seconds: 10
    }

  ];


  /* =====================================================
     REWARDS
  ===================================================== */

  const REWARDS = [

    {
      id: "break",
      icon: "☕",
      title: "15-minute break",
      desc: "Starts a real 15-minute break timer.",
      cost: 30,
      repeat: true
    },

    {
      id: "teal",
      icon: "🌊",
      title: "Teal accent",
      desc: "Switch the board accent colour to teal.",
      cost: 60,
      theme: "teal"
    },

    {
      id: "plum",
      icon: "🍇",
      title: "Plum accent",
      desc: "Switch the board accent colour to plum.",
      cost: 60,
      theme: "plum"
    },

    {
      id: "badge",
      icon: "★",
      title: "Gold star",
      desc: "Add a permanent star beside your level.",
      cost: 120
    }

  ];


  /* =====================================================
     STATE
  ===================================================== */

  function dayKey() {

    const d = new Date();

    return [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, "0"),
      String(d.getDate()).padStart(2, "0")
    ].join("-");

  }


  function fresh() {

    return {

      points: 0,
      lifetime: 0,
      spent: 0,
      done: {},
      log: [],
      owned: [],
      theme: "default",
      star: false,
      breakUntil: 0,
      day: dayKey()

    };

  }


  let S;


  function load() {

    try {

      S =
        JSON.parse(
          localStorage.getItem(SAVE_KEY)
        ) || fresh();

    } catch {

      S = fresh();

    }


    if (S.day !== dayKey()) {

      S.done = {};

      S.day = dayKey();

      save();

    }

  }


  function save() {

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(S)
    );

  }


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function toast(message) {

    const el =
      document.getElementById("toast");

    el.textContent =
      message;

    el.classList.add("show");

    clearTimeout(toast.timer);

    toast.timer =
      setTimeout(
        () => {

          el.classList.remove("show");

        },
        2400
      );

  }


  function finish(id) {

    if (S.done[id]) {
      return;
    }


    const q =
      QUESTS.find(
        x => x.id === id
      );


    if (!q) {
      return;
    }


    S.done[id] = true;

    S.points += q.points;

    S.lifetime += q.points;


    S.log.unshift({

      type: "quest",
      title: q.title,
      points: q.points,
      time: Date.now()

    });


    save();

    render();

    toast(
      "+" +
      q.points +
      " points — " +
      q.title
    );

  }


  /* =====================================================
     TIMER QUEST
  ===================================================== */

  function makeTimer(q) {

    const box =
      document.createElement("div");

    box.className =
      "controls";


    box.innerHTML = `

      <div class="ctl-row">

        <button
          class="btn solid start"
          type="button">

          Start ${q.seconds}s

        </button>

        <button
          class="btn claim"
          type="button"
          disabled>

          Claim ${q.points}

        </button>

      </div>

      <p class="msg note status">

        Timer must complete before claiming.

      </p>

    `;


    const start =
      box.querySelector(".start");

    const claim =
      box.querySelector(".claim");

    const status =
      box.querySelector(".status");


    let timer = null;

    let end = 0;


    start.addEventListener(
      "click",
      () => {

        start.disabled = true;

        end =
          Date.now() +
          q.seconds * 1000;


        status.textContent =
          "Running…";


        timer =
          setInterval(
            () => {

              const left =
                Math.max(
                  0,
                  Math.ceil(
                    (end - Date.now()) /
                    1000
                  )
                );


              status.textContent =
                left > 0
                  ? "Time remaining: " +
                    left +
                    "s"
                  : "Complete ✓";


              if (left <= 0) {

                clearInterval(timer);

                claim.disabled = false;

                status.className =
                  "msg good status";

              }

            },
            250
          );

      }
    );


    claim.addEventListener(
      "click",
      () => {

        finish(q.id);

      }
    );


    return box;

  }


  /* =====================================================
     ANSWER QUEST
  ===================================================== */

  function makeAnswer(q) {

    const box =
      document.createElement("div");

    box.className =
      "controls";


    box.innerHTML = `

      <input
        class="input answer"
        type="text"
        placeholder="Your answer">

      <div
        class="ctl-row"
        style="margin-top:8px">

        <button
          class="btn solid check"
          type="button">

          Check answer

        </button>

      </div>

      <p class="msg status"></p>

    `;


    const input =
      box.querySelector(".answer");

    const check =
      box.querySelector(".check");

    const status =
      box.querySelector(".status");


    check.addEventListener(
      "click",
      () => {

        const value =
          input.value
            .trim()
            .toLowerCase();


        if (
          value ===
          q.answer.toLowerCase()
        ) {

          status.textContent =
            "Correct ✓";

          status.className =
            "msg good status";

          check.disabled = true;

          input.disabled = true;

          finish(q.id);

        } else {

          status.textContent =
            "Not quite. Try again.";

          status.className =
            "msg bad status";

        }

      }
    );


    return box;

  }


  /* =====================================================
     WRITE QUEST
  ===================================================== */

  function makeWrite(q) {

    const box =
      document.createElement("div");

    box.className =
      "controls";


    box.innerHTML = `

      <textarea
        class="note-input"
        placeholder="Write your response..."></textarea>

      <div
        class="ctl-row"
        style="margin-top:8px">

        <button
          class="btn solid submit"
          type="button">

          Submit

        </button>

      </div>

      <p class="msg note status"></p>

    `;


    const textarea =
      box.querySelector(".note-input");

    const submit =
      box.querySelector(".submit");

    const status =
      box.querySelector(".status");


    submit.addEventListener(
      "click",
      () => {

        const text =
          textarea.value.trim();


        if (
          text.length <
          q.noteMin
        ) {

          status.textContent =
            "Write at least " +
            q.noteMin +
            " characters.";

          status.className =
            "msg warn status";

          return;

        }


        finish(q.id);

        textarea.disabled = true;

        submit.disabled = true;

        status.textContent =
          "Submitted ✓";

        status.className =
          "msg good status";

      }
    );


    return box;

  }


  /* =====================================================
     EXTERNAL QUEST
  ===================================================== */

  function makeExternal(q) {

    const need =
      q.seconds * 1000;


    let banked = 0;

    let awayAt = null;

    let opened = false;

    let cleared = false;


    const box =
      document.createElement("div");


    box.className =
      "controls";


    box.innerHTML = `

      <div class="ctl-row">

        <button
          class="btn solid open"
          type="button">

          Open link ↗

        </button>

        <button
          class="btn solid claim"
          type="button"
          disabled>

          Claim ${q.points}

        </button>

      </div>

      <p class="msg note status">

        Opens in a new tab. Return after
        ${q.seconds} seconds.

      </p>

    `;


    const openBtn =
      box.querySelector(".open");

    const claimBtn =
      box.querySelector(".claim");

    const status =
      box.querySelector(".status");


    function left() {

      return Math.max(
        0,
        Math.ceil(
          (need - banked) /
          1000
        )
      );

    }


    function clear() {

      cleared = true;

      document.removeEventListener(
        "visibilitychange",
        watch
      );


      claimBtn.disabled = false;

      openBtn.disabled = true;

      openBtn.textContent =
        "Visited ✓";


      status.textContent =
        "Visit timer completed. Claim your points.";

      status.className =
        "msg good status";

    }


    function watch() {

      if (document.hidden) {

        awayAt =
          Date.now();

      }

      else if (
        awayAt !== null
      ) {

        banked +=
          Date.now() -
          awayAt;

        awayAt = null;


        if (
          banked >= need
        ) {

          clear();

        }

        else if (
          opened &&
          !cleared
        ) {

          status.textContent =
            "Paused — " +
            left() +
            "s still needed.";

          status.className =
            "msg warn status";

        }

      }

    }


    openBtn.addEventListener(
      "click",
      () => {

        const w =
          window.open(
            q.url,
            "_blank",
            "noopener"
          );


        if (!w) {

          status.textContent =
            "Pop-up blocked. Allow pop-ups and try again.";

          status.className =
            "msg bad status";

          return;

        }


        opened = true;

        awayAt =
          Date.now();


        openBtn.disabled = true;

        openBtn.textContent =
          "Link opened";


        status.textContent =
          "Waiting for the visit timer…";


        document.addEventListener(
          "visibilitychange",
          watch
        );

      }
    );


    claimBtn.addEventListener(
      "click",
      () => {

        if (cleared) {

          finish(q.id);

        }

      }
    );


    return box;

  }


  /* =====================================================
     QUEST RENDERING
  ===================================================== */

  function renderQuests() {

    const list =
      document.getElementById(
        "questList"
      );


    list.innerHTML = "";


    QUESTS.forEach(
      q => {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "quest" +
          (
            S.done[q.id]
              ? " done"
              : ""
          );


        card.innerHTML = `

          <div class="quest-top">

            <div>

              <h3>
                ${escapeHTML(q.title)}
              </h3>

              <p>
                ${escapeHTML(q.desc)}
              </p>

            </div>

            <div class="reward-points">
              +${q.points}
            </div>

          </div>

        `;


        const holder =
          document.createElement(
            "div"
          );


        holder.className =
          "controls";


        if (
          S.done[q.id]
        ) {

          holder.innerHTML = `

            <p class="msg good">
              Completed ✓
            </p>

          `;

        }

        else {

          let controls;


          if (
            q.kind === "timer"
          ) {

            controls =
              makeTimer(q);

          }

          else if (
            q.kind === "answer"
          ) {

            controls =
              makeAnswer(q);

          }

          else if (
            q.kind === "write"
          ) {

            controls =
              makeWrite(q);

          }

          else if (
            q.kind === "external"
          ) {

            controls =
              makeExternal(q);

          }


          holder.appendChild(
            controls
          );

        }


        card.appendChild(
          holder
        );


        list.appendChild(
          card
        );

      }
    );

  }


  /* =====================================================
     REWARDS
  ===================================================== */

  function buy(r) {

    if (
      S.points <
      r.cost
    ) {

      toast(
        "Not enough points."
      );

      return;

    }


    S.points -= r.cost;

    S.spent += r.cost;


    if (r.repeat) {

      S.log.unshift({

        type: "reward",

        title: r.title,

        points: -r.cost,

        time: Date.now()

      });


      S.breakUntil =
        Date.now() +
        15 * 60 * 1000;


      save();

      render();

      toast(
        "15-minute break started."
      );

      return;

    }


    if (
      !S.owned.includes(r.id)
    ) {

      S.owned.push(r.id);

    }


    if (r.theme) {

      S.theme =
        r.theme;

    }


    if (
      r.id === "badge"
    ) {

      S.star = true;

    }


    S.log.unshift({

      type: "reward",

      title: r.title,

      points: -r.cost,

      time: Date.now()

    });


    save();

    render();

    toast(
      "Unlocked: " +
      r.title
    );

  }


  function renderRewards() {

    const list =
      document.getElementById(
        "rewardList"
      );


    list.innerHTML = "";


    REWARDS.forEach(
      r => {

        const owned =
          S.owned.includes(
            r.id
          );


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "reward";


        card.innerHTML = `

          <div class="reward-icon">
            ${r.icon}
          </div>

          <h3>
            ${escapeHTML(r.title)}
          </h3>

          <p>
            ${escapeHTML(r.desc)}
          </p>

          <div class="reward-bottom">

            <div class="cost">
              ${r.cost} pts
            </div>

            <button
              class="btn solid buy"
              ${
                (!r.repeat && owned)
                  ? "disabled"
                  : ""
              }
              type="button">

              ${
                (!r.repeat && owned)
                  ? "Owned ✓"
                  : "Unlock"
              }

            </button>

          </div>

        `;


        card.querySelector(
          ".buy"
        ).addEventListener(
          "click",
          () => buy(r)
        );


        list.appendChild(
          card
        );

      }
    );

  }


  /* =====================================================
     HISTORY
  ===================================================== */

  function renderHistory() {

    const list =
      document.getElementById(
        "historyList"
      );


    list.innerHTML = "";


    if (
      !S.log.length
    ) {

      list.innerHTML = `

        <div class="history-item">

          <span>
            No activity yet.
          </span>

        </div>

      `;

      return;

    }


    S.log.forEach(
      item => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "history-item";


        const date =
          new Date(
            item.time
          );


        row.innerHTML = `

          <div>

            <strong>
              ${escapeHTML(item.title)}
            </strong>

            <br>

            <small>
              ${date.toLocaleString()}
            </small>

          </div>

          <strong class="${
            item.points >= 0
              ? "good"
              : "bad"
          }">

            ${
              item.points >= 0
                ? "+"
                : ""
            }${item.points}

          </strong>

        `;


        list.appendChild(
          row
        );

      }
    );

  }


  /* =====================================================
     PROFILE
  ===================================================== */

  function renderProfile() {

    document.getElementById(
      "points"
    ).textContent =
      S.points;


    document.getElementById(
      "lifetime"
    ).textContent =
      S.lifetime;


    document.getElementById(
      "spent"
    ).textContent =
      S.spent;


    const level =
      Math.floor(
        S.lifetime /
        LEVEL_STEP
      ) + 1;


    document.getElementById(
      "level"
    ).textContent =
      level;


    document.getElementById(
      "star"
    ).textContent =
      S.star
        ? " ★"
        : "";


    const progress =
      S.lifetime %
      LEVEL_STEP;


    document.getElementById(
      "progress"
    ).style.width =
      progress + "%";


    document.body.classList.remove(
      "teal",
      "plum"
    );


    if (
      S.theme === "teal" ||
      S.theme === "plum"
    ) {

      document.body.classList.add(
        S.theme
      );

    }

  }


  /* =====================================================
     BREAK TIMER
  ===================================================== */

  function updateBreak() {

    const box =
      document.getElementById(
        "breakTimer"
      );


    if (!S.breakUntil) {

      box.classList.remove(
        "show"
      );

      return;

    }


    const left =
      Math.max(
        0,
        S.breakUntil -
        Date.now()
      );


    if (
      left <= 0
    ) {

      S.breakUntil = 0;

      save();

      box.classList.remove(
        "show"
      );

      return;

    }


    box.classList.add(
      "show"
    );


    const seconds =
      Math.ceil(
        left / 1000
      );


    const mins =
      Math.floor(
        seconds / 60
      );


    const secs =
      seconds % 60;


    document.getElementById(
      "breakTime"
    ).textContent =

      String(mins)
        .padStart(2, "0") +

      ":" +

      String(secs)
        .padStart(2, "0");

  }


  /* =====================================================
     NAVIGATION
  ===================================================== */

  function showPage(page) {

    document
      .querySelectorAll(
        ".section"
      )
      .forEach(
        section => {

          section.classList.remove(
            "active"
          );

        }
      );


    document
      .querySelectorAll(
        ".nav-btn"
      )
      .forEach(
        btn => {

          btn.classList.remove(
            "active"
          );

        }
      );


    const section =
      document.getElementById(
        page + "Page"
      );


    if (section) {

      section.classList.add(
        "active"
      );

    }


    const button =
      document.querySelector(
        `[data-page="${page}"]`
      );


    if (button) {

      button.classList.add(
        "active"
      );

    }


    const title =
      document.getElementById(
        "pageTitle"
      );


    const description =
      document.getElementById(
        "pageDescription"
      );


    if (
      page === "quests"
    ) {

      title.textContent =
        "Quest Board";

      description.textContent =
        "Complete simple tasks and collect points.";

    }


    if (
      page === "rewards"
    ) {

      title.textContent =
        "Rewards";

      description.textContent =
        "Spend your points on useful rewards.";

    }


    if (
      page === "history"
    ) {

      title.textContent =
        "History";

      description.textContent =
        "See your recent activity.";

    }

  }


  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(
      btn => {

        btn.addEventListener(
          "click",
          () => {

            showPage(
              btn.dataset.page
            );

          }
        );

      }
    );


  /* =====================================================
     RESET
  ===================================================== */

  document
    .getElementById(
      "resetBtn"
    )
    .addEventListener(
      "click",
      () => {

        const ok =
          confirm(
            "Reset all Quest Board progress?"
          );


        if (!ok) {
          return;
        }


        localStorage.removeItem(
          SAVE_KEY
        );


        S = fresh();

        render();

        toast(
          "Progress reset."
        );

      }
    );


  /* =====================================================
     RENDER
  ===================================================== */

  function render() {

    renderProfile();

    renderQuests();

    renderRewards();

    renderHistory();

    updateBreak();

  }


  /* =====================================================
     START
  ===================================================== */

  load();

  render();


  setInterval(
    updateBreak,
    1000
  );

</script>
